<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화려한 네온 사다리 게임</title>
    <style>
        :root {
            --bg-color: #0d0f18;
            --panel-bg: rgba(20, 24, 39, 0.7);
            --primary-glow: #00f2fe;
            --secondary-glow: #4facfe;
            --accent-pink: #ff007f;
            --accent-gold: #f6d365;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 20px;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Malgun Gothic', 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            margin: 10px 0 20px 0;
            font-size: 2rem;
            text-align: center;
            background: linear-gradient(45deg, var(--primary-glow), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85rem;
            color: #a0aec0;
        }

        input, select {
            background: rgba(10, 12, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 10px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--primary-glow);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(118, 75, 162, 0.6);
        }

        button.start-btn {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
        }
        button.start-btn:hover {
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.6);
        }

        .canvas-container {
            position: relative;
            width: 100%;
            background: rgba(5, 7, 12, 0.5);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
        }

        canvas {
            display: block;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            border-left: 4px solid var(--accent-pink);
            font-size: 1.1rem;
            min-height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <h1>🌟 NEON LADDER GAME 🌟</h1>
    
    <div class="container">
        <div class="settings-grid">
            <div class="input-group">
                <label for="participantCount">참가자 수 (2 ~ 8명)</label>
                <select id="participantCount" onchange="initInputs()">
                    <option value="2">2명</option>
                    <option value="3">3명</option>
                    <option value="4" selected>4명</option>
                    <option value="5">5명</option>
                    <option value="6">6명</option>
                    <option value="7">7명</option>
                    <option value="8">8명</option>
                </select>
            </div>
            <div class="input-group">
                <label>참가자 이름 (쉼표로 구분)</label>
                <input type="text" id="namesInput" value="참이슬, 카스, 버드와이저, 호가든" oninput="updateSettings()">
            </div>
            <div class="input-group">
                <label>결과 항목 (쉼표로 구분)</label>
                <input type="text" id="resultsInput" value="꽝, 1소주, 2소주, 면제" oninput="updateSettings()">
            </div>
        </div>

        <div class="btn-group">
            <button onclick="generateLadder()">사다리 다시 섞기</button>
            <button class="start-btn" onclick="startAnimation()">전체 결과 확인하기</button>
        </div>

        <div class="canvas-container">
            <canvas id="ladderCanvas"></canvas>
        </div>

        <div id="resultBox" class="result-box" style="display:none;"></div>
    </div>

<script>
    const canvas = document.getElementById('ladderCanvas');
    const ctx = canvas.getContext('2d');

    let config = {
        count: 4,
        names: [],
        results: []
    };

    let ladderData = {
        verticals: [],
        horizontals: [] // {r: rowIdx, c: colIdx} (colIdx와 colIdx+1을 잇는 가로선)
    };

    let isAnimating = false;

    function initInputs() {
        const count = parseInt(document.getElementById('participantCount').value);
        document.getElementById('participantCount').value = count;
        updateSettings();
    }

    function updateSettings() {
        const count = parseInt(document.getElementById('participantCount').value);
        const namesStr = document.getElementById('namesInput').value;
        const resultsStr = document.getElementById('resultsInput').value;

        config.count = count;
        config.names = namesStr.split(',').map(s => s.trim()).filter(Boolean);
        config.results = resultsStr.split(',').map(s => s.trim()).filter(Boolean);

        // 부족한 이름/결과는 자동 채우기
        while(config.names.length < count) config.names.push(`참가자${config.names.length+1}`);
        while(config.results.length < count) config.results.push(`결과${config.results.length+1}`);

        generateLadder();
    }

    function generateLadder() {
        const count = config.count;
        const rows = 10; // 사다리 높이 단계 수
        ladderData.horizontals = [];

        // 무작위 가로선 생성 (중복 방지 및 인접선 방지)
        for (let r = 0; r < rows; r++) {
            let c = 0;
            while (c < count - 1) {
                if (Math.random() < 0.45) { // 가로선 생성 확률
                    ladderData.horizontals.push({ r: r, c: c });
                    c += 2; // 바로 옆 칸에 연속 가로선 생기는 것 방지
                } else {
                    c += 1;
                }
            }
        }
        drawLadder();
        document.getElementById('resultBox').style.display = 'none';
    }

    function resizeCanvas() {
        const containerWidth = canvas.parentElement.clientWidth;
        canvas.width = containerWidth;
        canvas.height = 450;
    }

    function drawLadder(activePaths = []) {
        resizeCanvas();
        const width = canvas.width;
        const height = canvas.height;
        const count = config.count;

        ctx.clearRect(0, 0, width, height);

        const topMargin = 60;
        const bottomMargin = 60;
        const usableHeight = height - topMargin - bottomMargin;
        const colWidth = width / (count + 1);

        // 1. 세로선 그리기
        for (let i = 0; i < count; i++) {
            let x = colWidth * (i + 1);
            ctx.beginPath();
            ctx.moveTo(x, topMargin);
            ctx.lineTo(x, height - bottomMargin);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 상단 이름 렌더링
            ctx.fillStyle = '#00f2fe';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(config.names[i] || '', x, topMargin - 15);

            // 하단 결과 렌더링
            ctx.fillStyle = '#ff007f';
            ctx.fillText(config.results[i] || '', x, height - bottomMargin + 25);
        }

        const rows = 10;
        const rowHeight = usableHeight / rows;

        // 2. 가로선 그리기
        ladderData.horizontals.forEach(h => {
            let x1 = colWidth * (h.c + 1);
            let x2 = colWidth * (h.c + 2);
            let y = topMargin + (h.r + 0.5) * rowHeight;

            ctx.beginPath();
            ctx.moveTo(x1, y);
            ctx.lineTo(x2, y);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 3;
            ctx.stroke();
        });

        // 3. 활성화된 경로(애니메이션 선) 그리기
        activePaths.forEach(path => {
            if (path.points.length < 2) return;
            ctx.beginPath();
            ctx.moveTo(path.points[0].x, path.points[0].y);
            for (let i = 1; i < path.currentIdx; i++) {
                ctx.lineTo(path.points[i].x, path.points[i].y);
            }
            // 마지막 부분 부드러운 보간
            if (path.currentIdx < path.points.length) {
                let p1 = path.points[path.currentIdx - 1];
                let p2 = path.points[path.currentIdx];
                // progress는 외부에서 제어되거나 통째로 그림
            }
            ctx.strokeStyle = path.color;
            ctx.lineWidth = 4;
            ctx.shadowColor = path.color;
            ctx.shadowBlur = 10;
            ctx.stroke();
            ctx.shadowBlur = 0; // 초기화
        });
    }

    // 경로 계산 함수 (특정 출발 인덱스가 어디로 도착하는지)
    function tracePath(startCol) {
        const count = config.count;
        const topMargin = 60;
        const bottomMargin = 60;
        const usableHeight = canvas.height - topMargin - bottomMargin;
        const rows = 10;
        const rowHeight = usableHeight / rows;
        const colWidth = canvas.width / (count + 1);

        let currCol = startCol;
        let currRow = 0; // 0 ~ rows 구조 (y좌표 매핑용)
        let points = [];

        // 시작점
        let startX = colWidth * (currCol + 1);
        let startY = topMargin;
        points.push({ x: startX, y: startY });

        // 세로 이동을 row 단위로 세분화하여 포인트 생성
        for (let r = 0; r < rows; r++) {
            let currentY = topMargin + r * rowHeight;
            let nextY = topMargin + (r + 1) * rowHeight;
            
            // 현재 row에 내 위치와 연결된 가로선이 있는지 확인
            // 좌측에 연결된 선이 있는지 (currCol-1 과 currCol 사이)
            let leftH = ladderData.horizontals.find(h => h.r === r && h.c === currCol - 1);
            // 우측에 연결된 선이 있는지 (currCol 과 currCol+1 사이)
            let rightH = ladderData.horizontals.find(h => h.r === r && h.c === currCol);

            let midY = currentY + rowHeight / 2;

            points.push({ x: colWidth * (currCol + 1), y: midY });

            if (rightH) {
                currCol += 1;
                points.push({ x: colWidth * (currCol + 1), y: midY });
            } else if (leftH) {
                currCol -= 1;
                points.push({ x: colWidth * (currCol + 1), y: midY });
            }

            points.push({ x: colWidth * (currCol + 1), y: nextY });
        }

        points.push({ x: colWidth * (currCol + 1), y: canvas.height - bottomMargin });
        return { endCol: currCol, points: points };
    }

    async function startAnimation() {
        if (isAnimating) return;
        isAnimating = true;

        const colors = ['#00f2fe', '#ff007f', '#f6d365', '#4facfe', '#00ff87', '#fa709a', '#fee140', '#30cfd0'];
        let paths = [];
        let resultsSummary = [];

        for (let i = 0; i < config.count; i++) {
            let traced = tracePath(i);
            paths.push({
                start: config.names[i],
                end: config.results[traced.endCol],
                points: traced.points,
                progress: 0,
                color: colors[i % colors.length]
            });
        }

        // 애니메이션 루프 실행
        let frame = 0;
        let maxFrames = 60; // 총 애니메이션 프레임 수

        function animateStep() {
            frame++;
            let progressRatio = frame / maxFrames;

            let activeDrawData = paths.map(p => {
                let targetIndex = Math.floor(p.points.length * progressRatio);
                if (targetIndex < 1) targetIndex = 1;
                if (targetIndex > p.points.length) targetIndex = p.points.length;
                return {
                    color: p.color,
                    points: p.points,
                    currentIdx: targetIndex
                };
            });

            drawLadder(activeDrawData);

            if (frame < maxFrames) {
                requestAnimationFrame(animateStep);
            } else {
                isAnimating = false;
                // 결과 출력
                let summaryText = paths.map(p => `<b>${p.start}</b> ➔ <span style="color:var(--accent-gold);">${p.end}</span>`).join(' &nbsp;|&nbsp; ');
                let box = document.getElementById('resultBox');
                box.style.display = 'flex';
                box.innerHTML = `🎯 <b>[결과 매칭 완료]</b> &nbsp; ${summaryText}`;
            }
        }

        animateStep();
    }

    // 초기 실행
    window.onload = () => {
        initInputs();
        window.addEventListener('resize', () => drawLadder());
    };
</script>

</body>
</html>
