<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘은 당신! 사다리 게이무</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --sky1:#cbe8f7; --sky2:#e6f5fa;
    --cream:#fdf8ec; --cream2:#f7efdd;
    --wood1:#cf9a63; --wood2:#ac7444; --wood3:#8a5730;
    --green:#7cb35a; --mint:#cfe8ce; --pink:#f19fb6; --gold:#efb84a;
    --ink:#4a382a; --ink2:#7c6a58; --line:#e2d5bb;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; color:var(--ink); font-family:'Jua','Malgun Gothic',sans-serif;
    background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 45%,#eef5e6 100%);
    display:flex; flex-direction:column; align-items:center;
    padding:18px 14px 40px; overflow-x:hidden; min-height:100%;
  }
  body::before,body::after{
    content:''; position:fixed; border-radius:50%; background:#fff;
    filter:blur(1px); opacity:.9; pointer-events:none; z-index:0;
    width:210px; height:86px; left:-50px; top:46px;
    box-shadow:150px 34px 0 -12px #fff, 320px 6px 0 -22px #fff, 520px 40px 0 -26px #fff;
  }
  body::after{
    width:170px; height:70px; left:auto; right:-40px; top:210px;
    box-shadow:-190px 30px 0 -16px #fff, -380px -8px 0 -22px #fff;
  }
  h1{
    position:relative; z-index:1; font-family:'Jua',sans-serif; font-weight:400;
    font-size:clamp(24px,4vw,36px); letter-spacing:1px; text-align:center;
    margin:4px 0 12px; color:#fff;
    text-shadow:0 2px 0 #f3a8bc, 0 4px 0 #e79db4, 0 9px 16px rgba(120,86,66,.28);
  }
  .panel{
    position:relative; z-index:1; width:min(1000px,100%);
    background:linear-gradient(180deg,var(--wood1),var(--wood2) 55%,var(--wood3));
    border-radius:30px; padding:12px;
    box-shadow:0 20px 44px rgba(92,62,40,.28), inset 0 2px 0 rgba(255,255,255,.4);
  }
  .panel::before{
    content:''; position:absolute; inset:5px; border-radius:26px;
    border:2px dashed rgba(255,255,255,.32); pointer-events:none;
  }
  .inner{
    position:relative; background:var(--cream); border-radius:22px; padding:18px;
    box-shadow:inset 0 2px 12px rgba(150,120,85,.16), inset 0 0 0 3px #fffdf7;
    overflow:hidden;
  }
  .screen{display:none;}
  .screen.on{display:block;}

  /* ---------- create / join ---------- */
  .hero{
    position:relative; border-radius:18px; overflow:hidden;
    background:linear-gradient(180deg,#eaf7fb,#fdf8ec);
  }
  .hero img.art{
    display:block; width:100%; height:auto; opacity:.95;
    mix-blend-mode:multiply;
  }
  .hero .overlay{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:flex-end; padding:22px 22px 26px;
    background:linear-gradient(180deg, rgba(253,248,236,0) 0%, rgba(253,248,236,.55) 42%, rgba(253,248,236,.94) 72%, rgba(253,248,236,.99) 100%);
    text-align:center;
  }
  .hero .big{font-size:clamp(20px,3.2vw,30px); color:#4a382a; line-height:1.35; text-shadow:0 2px 0 #fff;}
  .hero .sub{color:#8b7761; font-size:14px; margin-top:8px;}
  .joinbox{
    display:flex; gap:8px; margin-top:16px; width:min(420px,100%);
  }
  .joinbox input{flex:1;}
  .field{display:flex; flex-direction:column; gap:7px; margin-bottom:12px;}
  .field label{font-size:14px; color:var(--ink2);}
  input[type=text],select{
    font-family:inherit; font-size:17px; color:var(--ink);
    background:#fffdf6; border:2px solid var(--line); border-radius:14px;
    padding:12px 14px; outline:none; width:100%; transition:.15s;
  }
  input[type=text]:focus,select:focus{border-color:#e7b96a; box-shadow:0 0 0 4px rgba(239,184,74,.18);}
  .row2{display:grid; grid-template-columns:1fr 150px; gap:14px;}
  @media(max-width:560px){ .row2{grid-template-columns:1fr;} }

  .btn{
    font-family:inherit; font-size:17px; cursor:pointer; border:none;
    border-radius:16px; padding:13px 22px; color:#5a4028;
    background:linear-gradient(180deg,#fff8e6,#f2e3c4);
    box-shadow:0 3px 0 #d9c3a0, 0 6px 14px rgba(140,105,70,.18);
    transition:.12s; white-space:nowrap;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:translateY(2px); box-shadow:0 1px 0 #d9c3a0;}
  .btn.primary{color:#6b3a24; background:linear-gradient(180deg,#ffd9a0,#f6b96a); box-shadow:0 3px 0 #d99a4c, 0 8px 18px rgba(210,150,80,.28);}
  .btn.pink{color:#7d2f45; background:linear-gradient(180deg,#ffd3de,#f5a8bd); box-shadow:0 3px 0 #d988a0, 0 8px 18px rgba(220,140,165,.26);}
  .btn.ghost{background:#fffdf6; color:var(--ink2); box-shadow:0 2px 0 #e3d7c2;}
  .btn[disabled]{opacity:.5; cursor:not-allowed; transform:none;}
  .btn-block{width:100%;}
  .btn-sm{font-size:14px; padding:9px 14px; border-radius:12px;}

  /* ---------- board ---------- */
  .bar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:2px 4px 10px;
  }
  .bar .info{font-size:14px; color:var(--ink2);}
  .bar .right{display:flex; gap:8px; align-items:center;}

  .scoreboard{
    display:flex; gap:6px; padding:8px; border-radius:14px;
    background:linear-gradient(180deg,#3b3229,#241d17);
    box-shadow:inset 0 2px 6px rgba(0,0,0,.5), 0 2px 0 rgba(255,255,255,.4);
    margin-bottom:8px;
  }
  .lamp{
    flex:1; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    font-size:12px; color:#7a6a58; background:#1b1611;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.7);
    transition:.25s; overflow:hidden; white-space:nowrap;
  }
  .lamp.on{
    color:#5a3b00; background:linear-gradient(180deg,#ffe680,#f7bd2e);
    box-shadow:0 0 16px rgba(255,205,70,.85), inset 0 0 8px rgba(255,255,255,.6);
    animation:lampPulse 1.1s ease-in-out infinite;
  }
  @keyframes lampPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}

  .stage{position:relative; border-radius:16px; overflow:hidden; background:#fdfaf0;
    box-shadow:inset 0 0 0 2px #f0e6d0;}
  .stage canvas{display:block; width:100%;}

  .actors{position:absolute; inset:0; pointer-events:none;}
  .actor{
    position:absolute; width:104px; height:142px; margin-left:-52px; text-align:center;
    pointer-events:none; will-change:left,top,transform;
  }
  .actor .nm{
    position:relative; z-index:2; display:inline-block; font-size:15px; color:#4a382a;
    padding:1px 8px; border-radius:10px; background:rgba(255,255,255,.92);
    box-shadow:0 1px 3px rgba(120,90,60,.18);
    max-width:92px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .actor.win .nm{color:#c9821c;}
  .actor img{
    display:block; height:118px; width:auto; margin:0 auto;
    filter:drop-shadow(0 3px 3px rgba(120,90,60,.18));
  }
  .actor .readybtn{
    position:absolute; top:52px; width:38px; height:26px; border-radius:13px;
    border:2px solid #d9c9a8; background:#fffdf6; color:#b8a482;
    font-family:inherit; font-size:11px; line-height:1; cursor:pointer; pointer-events:auto;
    box-shadow:0 2px 0 #d9c9a8; transition:.15s; display:flex; align-items:center; justify-content:center;
  }
  .actor .readybtn:hover{transform:translateY(-1px);}
  .actor .readybtn[disabled]{opacity:.5; cursor:default; box-shadow:none; transform:none;}
  .actor .readybtn.on{
    background:linear-gradient(180deg,#ffe680,#f7bd2e); color:#7a5200;
    border-color:#e0a92a; box-shadow:0 0 12px rgba(247,189,46,.8);
  }
  .actor.ready img{filter:drop-shadow(0 0 6px rgba(247,189,46,.75));}
  .actor.idle img{animation:idleBob 2.4s ease-in-out infinite; transform-origin:50% 100%;}
  @keyframes idleBob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.02)}}
  .actor .emote{
    position:absolute; top:8px; left:54px; width:52px; height:52px; border-radius:50%;
    background:#fff; border:3px solid #fff; box-shadow:0 4px 10px rgba(120,90,60,.28);
    overflow:hidden; display:none; animation:popIn .35s ease-out;
  }
  .actor .emote img{width:100%; height:100%; object-fit:cover; background:#fff;}
  .actor.win .emote,.actor.lose .emote{display:block;}
  .actor.win .emote{width:66px; height:66px; top:2px; left:50px; border-color:#ffd979; box-shadow:0 0 16px rgba(247,189,46,.9), 0 4px 10px rgba(120,90,60,.28);}
  @keyframes popIn{from{transform:scale(.3); opacity:0}to{transform:scale(1); opacity:1}}
  .actor.win img.body{animation:winShake .45s ease-in-out infinite;}
  @keyframes winShake{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-4px)}}
  .actor.lose img.body{animation:clapBob .5s ease-in-out infinite;}
  @keyframes clapBob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.03)}}

  .empty{
    position:absolute; width:96px; margin-left:-48px; text-align:center; color:#bcae97;
    font-size:12px;
  }
  .empty .ghost{
    width:56px; height:70px; margin:0 auto 4px; border:2px dashed #dfd2b8; border-radius:14px;
    background:rgba(255,255,255,.35);
  }

  .countdown{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(253,248,236,.38); backdrop-filter:blur(1px); z-index:5;
  }
  .countdown.on{display:flex;}
  .countdown span{
    font-size:clamp(70px,14vw,150px); color:#fff; line-height:1;
    text-shadow:0 4px 0 #f0a44a, 0 8px 0 #d98a2e, 0 16px 30px rgba(150,90,30,.4);
    animation:cdPop .9s ease-out;
  }
  @keyframes cdPop{0%{transform:scale(2.2); opacity:0}45%{transform:scale(1); opacity:1}100%{transform:scale(.94)}}

  .banner{
    margin-top:10px; text-align:center; font-size:19px; color:#7a5a2e; min-height:26px;
  }
  .banner b{color:#d2691e;}
  .board-actions{display:flex; gap:10px; justify-content:center; align-items:center; margin-top:12px; flex-wrap:wrap;}
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:#5c4632ee; color:#fff; font-size:14px; padding:10px 18px; border-radius:14px;
    opacity:0; pointer-events:none; transition:.25s; z-index:9;
  }
  .toast.on{opacity:1;}
  .conn{font-size:12px; color:#9aab8f; text-align:center; margin-top:10px;}
  .conn.off{color:#c08080;}
</style>
</head>
<body>
  <h1>오늘은 당신! 사다리 게이무</h1>

  <div class="panel">
    <div class="inner">

      <!-- 방 만들기 -->
      <section id="scr-create" class="screen">
        <div class="hero">
          <img class="art" src="hero.jpg" alt="">
          <div class="overlay">
            <div class="big">방을 만들고<br>친구들을 불러 보세요</div>
            <div class="sub">참가자 수를 정하고 링크를 보내면 끝!</div>
          </div>
        </div>
        <div class="row2" style="margin-top:14px">
          <div class="field">
            <label for="createName">내 이름</label>
            <input type="text" id="createName" maxlength="10" placeholder="예: 두희">
          </div>
          <div class="field">
            <label for="createCount">참가자 수</label>
            <select id="createCount">
              <option value="2">2명</option>
              <option value="3">3명</option>
              <option value="4" selected>4명</option>
              <option value="5">5명</option>
              <option value="6">6명</option>
              <option value="7">7명</option>
              <option value="8">8명</option>
            </select>
          </div>
        </div>
        <button class="btn primary btn-block" id="btnCreate">방 만들기</button>
      </section>

      <!-- 입장 -->
      <section id="scr-join" class="screen">
        <div class="hero">
          <img class="art" src="hero.jpg" alt="">
          <div class="overlay">
            <div class="big">사다리 게이무에 들어갑니다<br>이름을 정하세요</div>
            <div class="sub" id="joinSub">이름을 정하면 친구들과 함께 시작할 수 있어요</div>
            <div class="joinbox">
              <input type="text" id="joinName" maxlength="10" placeholder="이름 입력">
              <button class="btn primary" id="btnJoin">입장</button>
            </div>
          </div>
        </div>
      </section>

      <!-- 보드 -->
      <section id="scr-board" class="screen">
        <div class="bar">
          <div class="info" id="boardInfo">레디 0 / 0</div>
          <div class="right">
            <select id="lobbyCount" style="width:108px; padding:6px 8px; font-size:14px; border-radius:10px;">
              <option value="2">2명</option>
              <option value="3">3명</option>
              <option value="4">4명</option>
              <option value="5">5명</option>
              <option value="6">6명</option>
              <option value="7">7명</option>
              <option value="8">8명</option>
            </select>
            <button class="btn ghost btn-sm" id="btnCopy">링크 복사</button>
          </div>
        </div>

        <div class="scoreboard" id="scoreboard"></div>

        <div class="stage" id="stage">
          <canvas id="cv"></canvas>
          <div class="actors" id="actors"></div>
          <div class="countdown" id="countdown"><span id="cdNum">5</span></div>
        </div>

        <div class="banner" id="banner"></div>
        <div class="board-actions">
          <button class="btn pink" id="btnLeave">나가기</button>
        </div>
      </section>

      <div class="conn" id="conn"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  var NTFY = 'https://ntfy.sh';
  var ROWS = 11;
  var IMG = { c:[ 'k1.png','k2.png','k3.png','k4.png','k5.png','k6.png','k7.png','k8.png' ], laugh:'k-laugh.png', clap:'k-clap.png' };

  function $(s){ return document.querySelector(s); }
  function show(el, on){ el.classList.toggle('on', !!on); }
  function toast(msg){
    var t = $('#toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('on'); }, 2000);
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  var myId = sessionStorage.getItem('sadari.id');
  if(!myId){ myId = 'u' + Math.random().toString(36).slice(2,9); sessionStorage.setItem('sadari.id', myId); }
  var params = new URLSearchParams(location.search);
  var topic = params.get('r') || sessionStorage.getItem('sadari.topic') || '';

  var state = {
    count:4, host:'', players:[], ready:{},
    phase:'lobby',      // lobby | race | result
    ladder:null, winCol:0, round:0
  };
  var seen = Object.create(null);
  var rafId = 0;

  function setConn(ok){
    var c = $('#conn');
    c.textContent = ok ? '● 연결됨' : '● 연결 중…';
    c.classList.toggle('off', !ok);
  }

  var pollTimer = 0, lastTs = 0, polling = false;

  function connect(){
    if(!topic || polling) return;
    polling = true;
    lastTs = 0;
    setConn(false);
    pollOnce();
  }

  function pollOnce(){
    var url = NTFY + '/' + topic + '/json?poll=1&since=' + (lastTs ? lastTs : 'all');
    fetch(url, { cache: 'no-store' })
      .then(function(r){ return r.text(); })
      .then(function(txt){
        setConn(true);
        var lines = txt.split('\n');
        var maxTs = lastTs;
        for(var i = 0; i < lines.length; i++){
          var line = lines[i].trim();
          if(!line) continue;
          var m; try{ m = JSON.parse(line); }catch(e){ continue; }
          if(m.time && m.time > maxTs) maxTs = m.time;
          if(m.event !== 'message' || !m.message) continue;
          if(seen[m.id]) continue;
          seen[m.id] = 1;
          var d; try{ d = JSON.parse(m.message); }catch(e){ continue; }
          apply(d);
        }
        lastTs = maxTs;
      })
      .catch(function(){ setConn(false); })
      .then(function(){
        pollTimer = setTimeout(pollOnce, 2000);
      });
  }

  function disconnect(){
    polling = false;
    if(pollTimer) clearTimeout(pollTimer);
    pollTimer = 0;
  }

  function pub(obj){
    return fetch(NTFY + '/' + topic, { method:'POST', body: JSON.stringify(obj) })
      .catch(function(e){ toast('전송 실패. 잠시 후 다시 시도해 주세요'); throw e; });
  }

  var pendingReset = false;
  var joinedEcho = false;

  function apply(d){
    if(d.k === 'cfg'){ state.count = d.count; state.host = d.host; if(d.ladder) state.ladder = d.ladder; }
    else if(d.k === 'join'){
      if(d.id === myId) joinedEcho = true;
      if(!state.players.some(function(p){ return p.id === d.id; })) state.players.push({ id:d.id, name:d.name });
      if(state.phase !== 'lobby' && d.id !== myId && !pendingReset){
        pendingReset = true;
        setTimeout(function(){ if(state.phase !== 'lobby') pub({ k:'reset' }); }, 700);
      }
    }
    else if(d.k === 'leave'){
      state.players = state.players.filter(function(p){ return p.id !== d.id; });
      delete state.ready[d.id];
    }
    else if(d.k === 'ready'){ state.ready[d.id] = !!d.on; }
    else if(d.k === 'reset'){
      state.phase = 'lobby'; state.ladder = null; state.ready = {}; state.round = 0; state.actorPos = null;
      pendingReset = false; stopRace(); clearEmotes();
    }
    else if(d.k === 'start'){
      state.phase = 'race'; state.count = d.count; state.players = d.players.slice(); state.actorPos = null;
      state.ladder = d.ladder; state.winCol = d.winCol; state.round = d.round;
      beginCountdown();
    }
    render();
  }

  /* ---------------- ladder ---------------- */
  var cv = $('#cv'), ctx = cv.getContext('2d');
  var GEO = { w:0, h:510, top:124, bottom:100, rowH:0 };

  function layout(){
    var stage = $('#stage');
    var w = Math.max(320, Math.floor(stage.clientWidth));
    var h = 510;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    GEO.w = w; GEO.h = h;
    GEO.rowH = (h - GEO.top - GEO.bottom) / ROWS;
  }
  function colX(i, count){
    if(count < 2) return GEO.w / 2;
    var margin = Math.max(46, Math.min(70, GEO.w * 0.08));
    return margin + i * ((GEO.w - margin * 2) / (count - 1));
  }

  function buildLadder(count){
    var links = [], gap = [], i;
    for(i = 0; i < count; i++) gap.push(0);
    for(var r = 0; r < ROWS; r++){
      var used = {};
      var startC = (r % 2 === 0) ? 0 : (Math.random() < 0.5 ? 0 : 1);
      for(var c = startC; c < count - 1; c++){
        if(used[c]) continue;
        var force = (gap[c] >= 2 || gap[c + 1] >= 2);
        if(Math.random() < (force ? 0.8 : 0.45)){
          links.push([r, c]); used[c] = 1; used[c + 1] = 1;
        }
      }
      for(i = 0; i < count; i++) gap[i] = used[i] ? 0 : gap[i] + 1;
    }
    // make sure every neighbouring pair is connected a couple of times
    for(var c2 = 0; c2 < count - 1; c2++){
      var n = 0, guard = 0;
      for(i = 0; i < links.length; i++){ if(links[i][1] === c2) n++; }
      while(n < 2 && guard < 60){
        var rr = Math.floor(Math.random() * ROWS);
        var bad = false;
        for(i = 0; i < links.length; i++){
          var L2 = links[i];
          if(L2[0] === rr && (L2[1] === c2 || L2[1] === c2 - 1 || L2[1] === c2 + 1)){ bad = true; break; }
        }
        if(!bad){ links.push([rr, c2]); n++; }
        guard++;
      }
    }
    return { rows: ROWS, links: links };
  }

  function trace(startCol, ladder, count){
    var c = startCol, pts = [];
    pts.push({ x: colX(c, count), y: GEO.top });
    for(var r = 0; r < ladder.rows; r++){
      var midY = GEO.top + (r + 0.5) * GEO.rowH;
      var nextY = GEO.top + (r + 1) * GEO.rowH;
      pts.push({ x: colX(c, count), y: midY });
      var link = null;
      for(var k = 0; k < ladder.links.length; k++){
        var L = ladder.links[k];
        if(L[0] === r && (L[1] === c || L[1] === c - 1)){ link = L; break; }
      }
      if(link){ c = (link[1] === c) ? c + 1 : c - 1; pts.push({ x: colX(c, count), y: midY }); }
      pts.push({ x: colX(c, count), y: nextY });
    }
    return { end: c, pts: pts };
  }

  function roundRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawVine(x){
    var y1 = GEO.top, y2 = GEO.h - GEO.bottom, seg = 22, amp = 2.4, n = 0;
    ctx.beginPath(); ctx.moveTo(x, y1);
    for(var y = y1; y < y2; y += seg){
      var yy = Math.min(y + seg, y2);
      var dir = (n % 2 === 0) ? 1 : -1;
      ctx.quadraticCurveTo(x + amp * dir, (y + yy) / 2, x, yy);
      n++;
    }
    ctx.strokeStyle = '#8abf63'; ctx.lineWidth = 5.5; ctx.lineCap = 'round'; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.6; ctx.stroke();
    for(var ly = y1 + 26; ly < y2 - 10; ly += 54){
      var side = (Math.floor((ly - y1) / 54) % 2 === 0) ? 1 : -1;
      ctx.save(); ctx.translate(x + side * 7, ly); ctx.rotate(side * 0.5);
      ctx.beginPath(); ctx.ellipse(0, 0, 6.5, 3.4, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#a8d488'; ctx.fill(); ctx.restore();
    }
  }

  function drawRung(x1, x2, y){
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y);
    ctx.strokeStyle = '#dfc98f'; ctx.lineWidth = 12; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y);
    ctx.strokeStyle = '#f4e7bd'; ctx.lineWidth = 6; ctx.stroke();
  }

  function drawBadge(cx, cy, win){
    var w = win ? 92 : 70, h = win ? 38 : 31;
    if(win){
      roundRect(cx - w / 2, cy - h / 2, w, h, 13);
      var g = ctx.createLinearGradient(0, cy - h / 2, 0, cy + h / 2);
      g.addColorStop(0, '#ffd979'); g.addColorStop(1, '#f0ac33');
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = '700 20px Jua, sans-serif';
    }else{
      roundRect(cx - w / 2, cy - h / 2, w, h, 11);
      ctx.fillStyle = '#e9f4df'; ctx.fill();
      ctx.strokeStyle = '#c3e0a9'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = '#6d9663'; ctx.font = '700 17px Jua, sans-serif';
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(win ? '당첨!' : '면제', cx, cy + 1);
  }

  function drawBoard(){
    layout();
    ctx.clearRect(0, 0, GEO.w, GEO.h);
    ctx.fillStyle = '#fdfaf0';
    roundRect(0, 0, GEO.w, GEO.h, 16); ctx.fill();

    ctx.fillStyle = '#f1f7e6';
    ctx.beginPath();
    ctx.moveTo(0, GEO.h - GEO.bottom);
    ctx.quadraticCurveTo(GEO.w * 0.5, GEO.h - GEO.bottom - 18, GEO.w, GEO.h - GEO.bottom);
    ctx.lineTo(GEO.w, GEO.h); ctx.lineTo(0, GEO.h); ctx.closePath(); ctx.fill();

    var count = state.count, i;
    for(i = 0; i < count; i++) drawVine(colX(i, count));

    if(state.ladder){
      for(i = 0; i < state.ladder.links.length; i++){
        var L = state.ladder.links[i];
        drawRung(colX(L[1], count), colX(L[1] + 1, count), GEO.top + (L[0] + 0.5) * GEO.rowH);
      }
    }
    for(i = 0; i < count; i++){
      drawBadge(colX(i, count), GEO.h - GEO.bottom + 46, i === state.winCol);
    }
  }

  /* ---------------- actors ---------------- */
  var actorEls = {};

  function actorEl(i){
    var key = 'a' + i;
    if(actorEls[key]) return actorEls[key];
    var d = document.createElement('div');
    d.className = 'actor';
    d.innerHTML =
      '<div class="nm"></div>' +
      '<img class="body" alt="">' +
      '<div class="emote"><img alt=""></div>' +
      '<button class="readybtn" title="레디">✓</button>';
    $('#actors').appendChild(d);
    actorEls[key] = d;
    return d;
  }

  function clearActorLayer(){
    $('#actors').innerHTML = '';
    actorEls = {};
  }

  function renderActors(){
    var count = state.count, i;
    var needRebuild = Object.keys(actorEls).length !== count;
    if(needRebuild) clearActorLayer();
    // remove placeholders that no longer belong to the board
    Array.prototype.slice.call(document.querySelectorAll('.empty')).forEach(function(e){
      if(parseInt(e.dataset.idx, 10) >= count) e.remove();
    });

    for(i = 0; i < count; i++){
      var p = state.players[i];
      var x = colX(i, count);
      if(!p){
        var e = document.getElementById('empty' + i);
        if(!e){
          e = document.createElement('div');
          e.className = 'empty'; e.id = 'empty' + i; e.dataset.idx = String(i);
          e.innerHTML = '<div class="ghost"></div>기다리는 중';
          $('#actors').appendChild(e);
        }
        e.style.left = x + 'px';
        e.style.top = (GEO.top - 108) + 'px';
        continue;
      }
      var old = document.getElementById('empty' + i); if(old) old.remove();

      var el = actorEl(i);
      el.style.display = '';
      if(state.phase === 'result' && state.ladder){
        var endRes = trace(i, state.ladder, count);
        var endPt = endRes.pts[endRes.pts.length - 1];
        el.style.left = endPt.x + 'px';
        el.style.top = (endPt.y - 142) + 'px';
      }else{
        el.style.left = x + 'px';
        el.style.top = (GEO.top - 142) + 'px';
      }
      el.querySelector('.nm').textContent = p.name;
      var img = el.querySelector('img.body');
      if(img.getAttribute('src') !== IMG.c[i % 8]) img.src = IMG.c[i % 8];
      var ready = !!state.ready[p.id];
      el.classList.toggle('ready', ready);
      el.classList.toggle('idle', state.phase === 'lobby');

      var btn = el.querySelector('.readybtn');
      var isMe = (p.id === myId);
      btn.classList.toggle('on', ready);
      btn.textContent = ready ? '✓' : (isMe ? '레디' : '대기');
      btn.disabled = !isMe;
      btn.style.display = (state.phase === 'lobby') ? 'flex' : 'none';
      btn.style.right = (x > GEO.w - 90) ? '-8px' : '-34px';
      btn.style.left = (x > GEO.w - 90) ? 'auto' : 'auto';

      var em = el.querySelector('.emote');
      var emImg = em.querySelector('img');
      if(state.phase === 'result'){
        var endCol = trace(i, state.ladder, count).end;
        var isWin = endCol === state.winCol;
        el.classList.toggle('win', isWin);
        el.classList.toggle('lose', !isWin);
        emImg.src = isWin ? IMG.laugh : IMG.clap;
      }else{
        el.classList.remove('win', 'lose');
      }
    }
  }

  function clearEmotes(){
    Object.keys(actorEls).forEach(function(k){
      actorEls[k].classList.remove('win', 'lose');
    });
  }

  function setActorPos(i, x, y, rot){
    var el = actorEls['a' + i];
    if(!el) return;
    el.style.left = x + 'px';
    el.style.top = (y - 142) + 'px';
    el.style.transform = 'rotate(' + rot + 'deg)';
  }

  /* ---------------- scoreboard ---------------- */
  function renderScoreboard(){
    var sb = $('#scoreboard');
    if(sb.children.length !== state.count){
      sb.innerHTML = '';
      for(var i = 0; i < state.count; i++){
        var d = document.createElement('div');
        d.className = 'lamp';
        sb.appendChild(d);
      }
    }
    for(var j = 0; j < state.count; j++){
      var p = state.players[j];
      var lamp = sb.children[j];
      var on = !!(p && state.ready[p.id]);
      lamp.classList.toggle('on', on);
      lamp.textContent = p ? (on ? p.name : '·') : '·';
    }
    var readyCount = state.players.filter(function(p){ return state.ready[p.id]; }).length;
    $('#boardInfo').textContent = '레디 ' + readyCount + ' / ' + state.count + '  ·  참가 ' + state.players.length + '명';
  }

  /* ---------------- rendering ---------------- */
  function render(){
    var me = state.players.filter(function(p){ return p.id === myId; })[0];
    var inRoom = !!topic;

    show($('#scr-create'), !inRoom);
    show($('#scr-join'), inRoom && !me);
    show($('#scr-board'), inRoom && !!me);

    if(inRoom && me){
      if(state.phase === 'result'){
        $('#banner').innerHTML = '<b>게임 끝!</b> 다시 하려면 나가기를 눌러 주세요';
      }else if(state.players.length < state.count){
        $('#banner').textContent = '친구를 기다리는 중… (' + state.players.length + '/' + state.count + ')';
      }else{
        var left = state.players.filter(function(p){ return !state.ready[p.id]; }).length;
        $('#banner').textContent = left === 0 ? '모두 레디! 곧 시작합니다' : '레디 버튼을 눌러 주세요 (' + left + '명 남음)';
      }
      $('#lobbyCount').value = String(state.count);
      $('#lobbyCount').disabled = state.host !== myId || state.phase !== 'lobby';
      drawBoard();
      renderActors();
      renderScoreboard();
      maybeAutoStart();
    }else if(inRoom && !me){
      if(state.phase !== 'lobby'){
        $('#joinSub').textContent = '지금 게임이 진행 중이에요. 잠시 후 다시 시도해 주세요';
      }else{
        $('#joinSub').textContent = '이름을 정하면 친구들과 함께 시작할 수 있어요';
      }
    }
  }

  /* ---------------- start / countdown / race ---------------- */
  var startPublished = false;

  function maybeAutoStart(){
    if(state.phase !== 'lobby' || startPublished) return;
    if(state.players.length < state.count) return;
    if(!state.players.every(function(p){ return state.ready[p.id]; })) return;

    var isHost = (state.host === myId);
    if(!isHost){
      // fallback: if the host is gone, the first player kicks off after a moment
      setTimeout(function(){
        if(state.phase !== 'lobby' || startPublished) return;
        var firstId = state.players[0] && state.players[0].id;
        if(firstId === myId && !state.players.some(function(p){ return p.id === state.host; })){
          publishStart();
        }
      }, 1600);
      return;
    }
    publishStart();
  }

  function publishStart(){
    if(startPublished || state.phase !== 'lobby') return;
    startPublished = true;
    var count = state.count;
    var players = state.players.slice(0, count);
    var ladder = (state.ladder && state.ladder.rows) ? state.ladder : buildLadder(count);
    var winCol = Math.floor(Math.random() * count);
    pub({ k:'start', count:count, players:players, ladder:ladder, winCol:winCol, round:Date.now() })
      .catch(function(){ startPublished = false; });
  }

  function beginCountdown(){
    stopRace();
    startPublished = false;
    $('#banner').textContent = '곧 시작합니다!';
    var cd = $('#countdown'), num = $('#cdNum');
    cd.classList.add('on');
    var n = 5;
    num.textContent = n;
    num.style.animation = 'none'; void num.offsetWidth; num.style.animation = '';
    var timer = setInterval(function(){
      n--;
      if(n > 0){
        num.textContent = n;
        num.style.animation = 'none'; void num.offsetWidth; num.style.animation = '';
      }else{
        clearInterval(timer);
        num.textContent = '출발!';
        setTimeout(function(){ cd.classList.remove('on'); }, 500);
        setTimeout(runRace, 350);
      }
    }, 1000);
  }

  function stopRace(){ if(rafId) cancelAnimationFrame(rafId); rafId = 0; }

  function easeInOut(t){ return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }

  function pointAt(pts, idx){
    var i = Math.floor(idx), f = idx - i;
    if(i >= pts.length - 1) return pts[pts.length - 1];
    var a = pts[i], b = pts[i + 1];
    return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f };
  }

  function runRace(){
    var count = state.count, players = state.players;
    var paths = players.slice(0, count).map(function(p, i){ return trace(i, state.ladder, count); });
    var t0 = 0, dur = 3200;

    Object.keys(actorEls).forEach(function(k){ actorEls[k].classList.remove('idle'); });

    function frame(ts){
      if(!t0) t0 = ts;
      var t = Math.min(1, (ts - t0) / dur);
      var e = easeInOut(t);
      paths.forEach(function(res, i){
        var idx = e * (res.pts.length - 1);
        var pos = pointAt(res.pts, idx);
        var wob = Math.sin(t * 16 + i * 1.7) * 9 * (1 - t * 0.3);
        setActorPos(i, pos.x, pos.y, wob);
      });
      if(t < 1){ rafId = requestAnimationFrame(frame); }
      else{
        rafId = 0;
        paths.forEach(function(res, i){
          var last = res.pts[res.pts.length - 1];
          setActorPos(i, last.x, last.y, 0);
        });
        state.actorPos = {};
        paths.forEach(function(res, i){
          var last = res.pts[res.pts.length - 1];
          state.actorPos[i] = { x: last.x, y: last.y };
        });
        state.phase = 'result';
        render();
      }
    }
    rafId = requestAnimationFrame(frame);
  }

  /* ---------------- actions ---------------- */
  $('#btnCreate').addEventListener('click', function(){
    var name = $('#createName').value.trim();
    if(!name){ toast('이름을 입력해 주세요'); return; }
    var count = parseInt($('#createCount').value, 10);
    topic = 'sadari-' + Math.random().toString(36).slice(2, 9);
    sessionStorage.setItem('sadari.topic', topic);
    sessionStorage.setItem('sadari.name', name);
    history.replaceState(null, '', location.pathname + '?r=' + topic);
    state.count = count; state.host = myId;
    state.players = [{ id:myId, name:name }];
    state.phase = 'lobby';
    state.ladder = buildLadder(count);
    connect();
    pub({ k:'cfg', count:count, host:myId, ladder:state.ladder })
      .then(function(){ return pub({ k:'join', id:myId, name:name }); })
      .then(function(){ render(); });
    render();
  });

  $('#btnJoin').addEventListener('click', function(){
    var name = $('#joinName').value.trim();
    if(!name){ toast('이름을 입력해 주세요'); return; }
    sessionStorage.setItem('sadari.name', name);
    if(!state.players.some(function(p){ return p.id === myId; }))
      state.players.push({ id:myId, name:name });
    render();
    pub({ k:'join', id:myId, name:name }).catch(function(){});
    setTimeout(function(){
      if(!joinedEcho) pub({ k:'join', id:myId, name:name }).catch(function(){});
    }, 2200);
  });

  $('#btnCopy').addEventListener('click', function(){
    var link = location.origin + location.pathname + '?r=' + topic;
    navigator.clipboard.writeText(link).then(function(){ toast('링크를 복사했어요'); },
      function(){ toast(link); });
  });

  $('#lobbyCount').addEventListener('change', function(e){
    if(state.host !== myId) return;
    var n = parseInt(e.target.value, 10);
    state.ladder = buildLadder(n);
    pub({ k:'cfg', count:n, host:myId, ladder:state.ladder });
  });

  function leave(){
    pub({ k:'leave', id:myId }).catch(function(){});
    disconnect();
    stopRace();
    try{ sessionStorage.setItem('sadari.leave', '1'); }catch(e){}
    location.reload();
  }
  $('#btnLeave').addEventListener('click', leave);

  // ready button (event delegation)
  document.addEventListener('click', function(e){
    var btn = e.target.closest && e.target.closest('.readybtn');
    if(!btn) return;
    var me = state.players.filter(function(p){ return p.id === myId; })[0];
    if(!me || state.phase !== 'lobby') return;
    var on = !state.ready[myId];
    state.ready[myId] = on;
    render();
    pub({ k:'ready', id:myId, on:on });
  });

  window.addEventListener('resize', function(){
    if($('#scr-board').classList.contains('on')){ drawBoard(); renderActors(); }
  });

  /* ---------------- boot ---------------- */
  (function boot(){
    if(topic){
      var saved = sessionStorage.getItem('sadari.name');
      if(saved) $('#joinName').value = saved;
      connect();
    }
    setConn(false);
    render();
  })();
})();
</script>
</body>
</html>
