<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘은 당신! 사다리 게이무</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --sky1:#cbe8f7; --sky2:#e6f5fa;
    --cream:#fdf8ec; --cream2:#f7efdd;
    --wood1:#cf9a63; --wood2:#ac7444; --wood3:#8a5730;
    --green:#7cb35a; --mint:#cfe8ce; --pink:#f19fb6; --gold:#efb84a;
    --ink:#4a382a; --ink2:#7c6a58; --line:#e2d5bb;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; color:var(--ink); font-family:'Jua','Malgun Gothic',sans-serif;
    background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 45%,#eef5e6 100%);
    display:flex; flex-direction:column; align-items:center;
    padding:20px 14px 44px; overflow-x:hidden; min-height:100%;
  }
  body::before,body::after{
    content:''; position:fixed; border-radius:50%; background:#fff;
    filter:blur(1px); opacity:.9; pointer-events:none; z-index:0;
    width:210px; height:86px; left:-50px; top:46px;
    box-shadow:150px 34px 0 -12px #fff, 320px 6px 0 -22px #fff, 520px 40px 0 -26px #fff;
  }
  body::after{
    width:170px; height:70px; left:auto; right:-40px; top:210px;
    box-shadow:-190px 30px 0 -16px #fff, -380px -8px 0 -22px #fff;
  }
  h1{
    position:relative; z-index:1;
    font-family:'Jua',sans-serif; font-weight:400;
    font-size:clamp(26px,4.4vw,40px); letter-spacing:1px; text-align:center;
    margin:6px 0 6px; color:#fff;
    text-shadow:0 2px 0 #f3a8bc, 0 4px 0 #e79db4, 0 9px 16px rgba(120,86,66,.28);
  }
  .subtitle{position:relative; z-index:1; color:#7e8f9e; font-size:14px; margin-bottom:16px;}
  .panel{
    position:relative; z-index:1; width:min(940px,100%);
    background:linear-gradient(180deg,var(--wood1),var(--wood2) 55%,var(--wood3));
    border-radius:30px; padding:13px;
    box-shadow:0 20px 44px rgba(92,62,40,.28), inset 0 2px 0 rgba(255,255,255,.4);
  }
  .panel::before{
    content:''; position:absolute; inset:5px; border-radius:26px;
    border:2px dashed rgba(255,255,255,.35); pointer-events:none;
  }
  .inner{
    background:var(--cream); border-radius:22px; padding:20px 20px 22px;
    box-shadow:inset 0 2px 12px rgba(150,120,85,.16), inset 0 0 0 3px #fffdf7;
  }
  .screen{display:none;}
  .screen.on{display:block;}
  .lead{text-align:center; color:var(--ink2); font-size:15px; margin:2px 0 18px;}

  .field{display:flex; flex-direction:column; gap:7px; margin-bottom:14px;}
  .field label{font-size:14px; color:var(--ink2);}
  input[type=text],select{
    font-family:inherit; font-size:17px; color:var(--ink);
    background:#fffdf6; border:2px solid var(--line); border-radius:14px;
    padding:12px 14px; outline:none; width:100%; transition:.15s;
  }
  input[type=text]:focus,select:focus{border-color:#e7b96a; box-shadow:0 0 0 4px rgba(239,184,74,.18);}
  .row2{display:grid; grid-template-columns:1fr 150px; gap:14px;}
  @media(max-width:560px){ .row2{grid-template-columns:1fr;} }

  .btn{
    font-family:inherit; font-size:17px; cursor:pointer; border:none;
    border-radius:16px; padding:13px 22px; color:#5a4028;
    background:linear-gradient(180deg,#fff8e6,#f2e3c4);
    box-shadow:0 3px 0 #d9c3a0, 0 6px 14px rgba(140,105,70,.18);
    transition:.12s;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:translateY(2px); box-shadow:0 1px 0 #d9c3a0;}
  .btn.primary{color:#6b3a24; background:linear-gradient(180deg,#ffd9a0,#f6b96a); box-shadow:0 3px 0 #d99a4c, 0 8px 18px rgba(210,150,80,.28);}
  .btn.pink{color:#7d2f45; background:linear-gradient(180deg,#ffd3de,#f5a8bd); box-shadow:0 3px 0 #d988a0, 0 8px 18px rgba(220,140,165,.26);}
  .btn.ghost{background:#fffdf6; color:var(--ink2); box-shadow:0 2px 0 #e3d7c2;}
  .btn[disabled]{opacity:.5; cursor:not-allowed; transform:none;}
  .btn-block{width:100%;}
  .btn-sm{font-size:14px; padding:9px 14px; border-radius:12px;}

  .seats{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:12px; margin:8px 0 18px;}
  .seat{
    background:#fffdf6; border:2px solid #efe4cd; border-radius:18px; padding:10px 6px;
    text-align:center; min-height:86px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:6px;
  }
  .seat.filled{border-color:#d9e8c9; background:#fbfdf5;}
  .seat.me{border-color:#f0be4a; background:#fffaec; box-shadow:0 0 0 3px rgba(240,190,74,.18);}
  .ava{
    width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:17px; border:3px solid #fff; box-shadow:0 2px 6px rgba(120,90,70,.18);
  }
  .seat .nm{font-size:14px; color:var(--ink); line-height:1.1; word-break:break-all;}
  .seat .ph{font-size:13px; color:#bcae97;}
  .seat .tag{font-size:11px; color:#c58a2a;}

  .share{display:flex; gap:8px; margin:0 0 16px;}
  .share input{font-size:13px; color:var(--ink2);}
  .lobby-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .hint{font-size:13px; color:#9d8f7c; margin-top:10px; text-align:center;}
  .conn{font-size:12px; color:#9aab8f; text-align:center; margin-top:12px;}
  .conn.off{color:#c08080;}

  .canvas-wrap{
    background:#fdfaf0; border-radius:20px; padding:6px;
    box-shadow:inset 0 0 0 2px #f0e6d0, 0 4px 14px rgba(150,120,85,.12);
    overflow:hidden;
  }
  canvas{display:block; width:100%;}
  .game-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:16px;}

  .result-card{
    display:none; margin-top:16px; text-align:center; padding:18px 16px;
    border-radius:20px; background:linear-gradient(180deg,#fff9e6,#fdefcf);
    border:3px solid #f3d79a; box-shadow:0 8px 20px rgba(200,160,90,.2);
    animation:pop .35s ease-out;
  }
  .result-card.on{display:block;}
  .result-card .big{font-size:30px; margin:6px 0 4px;}
  .result-card.win{background:linear-gradient(180deg,#fff4d2,#ffe0a6); border-color:#f0be4a;}
  .result-card.lose{background:linear-gradient(180deg,#f6fbf0,#e8f4dd); border-color:#bfe0a8;}
  @keyframes pop{from{transform:scale(.94); opacity:0;} to{transform:scale(1); opacity:1;}}
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:#5c4632ee; color:#fff; font-size:14px; padding:10px 18px; border-radius:14px;
    opacity:0; pointer-events:none; transition:.25s; z-index:9;
  }
  .toast.on{opacity:1;}
</style>
</head>
<body>
  <h1>오늘은 당신! 사다리 게이무</h1>
  <div class="subtitle">각자 컴퓨터로 접속해서 이름을 입력하고 함께 사다리를 타요</div>

  <div class="panel">
    <div class="inner">

      <!-- 방 만들기 -->
      <section id="scr-create" class="screen">
        <p class="lead">방을 만들고 링크를 친구들에게 보내 주세요</p>
        <div class="row2">
          <div class="field">
            <label for="createName">내 이름</label>
            <input type="text" id="createName" maxlength="10" placeholder="예: 두희">
          </div>
          <div class="field">
            <label for="createCount">참가자 수</label>
            <select id="createCount">
              <option value="2">2명</option>
              <option value="3">3명</option>
              <option value="4" selected>4명</option>
              <option value="5">5명</option>
              <option value="6">6명</option>
              <option value="7">7명</option>
              <option value="8">8명</option>
            </select>
          </div>
        </div>
        <button class="btn primary btn-block" id="btnCreate">방 만들기</button>
        <p class="hint">방을 만들면 참가자들이 들어올 수 있는 링크가 생겨요</p>
      </section>

      <!-- 입장 -->
      <section id="scr-join" class="screen">
        <p class="lead" id="joinLead">이름을 입력하고 들어와 주세요</p>
        <div class="field">
          <label for="joinName">내 이름</label>
          <input type="text" id="joinName" maxlength="10" placeholder="예: 두희">
        </div>
        <button class="btn primary btn-block" id="btnJoin">입장하기</button>
        <p class="hint" id="joinHint"></p>
      </section>

      <!-- 대기실 -->
      <section id="scr-lobby" class="screen">
        <p class="lead">친구들을 기다리는 중이에요</p>
        <div class="seats" id="seatGrid"></div>
        <div class="share">
          <input type="text" id="shareLink" readonly>
          <button class="btn ghost btn-sm" id="btnCopy">복사</button>
        </div>
        <div class="lobby-actions">
          <select id="lobbyCount" style="max-width:130px">
            <option value="2">2명</option>
            <option value="3">3명</option>
            <option value="4">4명</option>
            <option value="5">5명</option>
            <option value="6">6명</option>
            <option value="7">7명</option>
            <option value="8">8명</option>
          </select>
          <button class="btn primary" id="btnStart">사다리 시작</button>
          <button class="btn ghost" id="btnLeave">방 나가기</button>
        </div>
        <p class="hint" id="lobbyHint"></p>
      </section>

      <!-- 게임 -->
      <section id="scr-game" class="screen">
        <div class="canvas-wrap"><canvas id="cv"></canvas></div>
        <div class="game-actions">
          <button class="btn pink" id="btnReveal">내 결과 확인하기</button>
          <button class="btn ghost" id="btnShuffle">사다리 다시 섞기</button>
          <button class="btn ghost" id="btnAll">전체 결과 보기</button>
          <button class="btn ghost" id="btnBack">대기실로</button>
          <button class="btn ghost" id="btnLeave2">방 나가기</button>
        </div>
        <div class="result-card" id="resultCard"></div>
        <p class="hint" id="gameHint"></p>
      </section>

      <div class="conn" id="conn"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  var NTFY = 'https://ntfy.sh';
  var COLORS = ['#f2a0b5','#f5b26b','#9cce9f','#8dbfe0','#c6a5e0','#eec96b','#8fd4c9','#e79b8a'];
  var ROWS = 11;

  function $(s){ return document.querySelector(s); }
  function show(el, on){ el.classList.toggle('on', !!on); }
  function toast(msg){
    var t = $('#toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('on'); }, 2200);
  }

  // ---- identity
  var myId = sessionStorage.getItem('sadari.id');
  if(!myId){ myId = 'u' + Math.random().toString(36).slice(2,9); sessionStorage.setItem('sadari.id', myId); }

  var params = new URLSearchParams(location.search);
  var topic = params.get('r') || sessionStorage.getItem('sadari.topic') || '';

  var state = { count:4, host:'', players:[], phase:'lobby', ladder:null, winCol:0, reveal:{}, round:0 };
  var seen = Object.create(null);
  var es = null;
  var connected = false;

  // ---- transport
  function setConn(ok){
    connected = ok;
    var c = $('#conn');
    c.textContent = ok ? '● 연결됨' : '● 연결 중…';
    c.classList.toggle('off', !ok);
  }

  function connect(){
    if(!topic) return;
    if(es) es.close();
    setConn(false);
    try{
      es = new EventSource(NTFY + '/' + topic + '/sse?since=all');
      es.onopen = function(){ setConn(true); };
      es.onmessage = function(ev){
        var m; try{ m = JSON.parse(ev.data); }catch(e){ return; }
        if(m.event !== 'message' || !m.message) return;
        if(seen[m.id]) return;
        seen[m.id] = 1;
        setConn(true);
        var d; try{ d = JSON.parse(m.message); }catch(e){ return; }
        apply(d);
      };
      es.onerror = function(){ setConn(false); };
    }catch(e){ setConn(false); }
  }

  function pub(obj){
    return fetch(NTFY + '/' + topic, { method:'POST', body: JSON.stringify(obj) })
      .catch(function(e){ toast('전송에 실패했어요. 잠시 후 다시 시도해 주세요'); throw e; });
  }

  function apply(d){
    if(d.k === 'cfg'){ state.count = d.count; state.host = d.host; }
    else if(d.k === 'join'){
      if(!state.players.some(function(p){ return p.id === d.id; })) state.players.push({ id:d.id, name:d.name });
    }
    else if(d.k === 'leave'){ state.players = state.players.filter(function(p){ return p.id !== d.id; }); }
    else if(d.k === 'start'){
      state.phase = 'game'; state.count = d.count; state.players = d.players.slice();
      state.ladder = d.ladder; state.winCol = d.winCol; state.round = d.round; state.reveal = {};
      resultShown = false; animating = false;
    }
    else if(d.k === 'reset'){ state.phase = 'lobby'; state.ladder = null; state.reveal = {}; resultShown = false; }
    else if(d.k === 'clear'){ state.phase = 'lobby'; state.players = []; state.ladder = null; state.reveal = {}; }
    else if(d.k === 'reveal'){ state.reveal[d.id] = true; }
    render();
  }

  // ---- geometry / ladder
  var cv = $('#cv'), ctx = cv.getContext('2d');
  var GEO = { w:0, h:0, top:98, bottom:92, rowH:0 };

  function layout(){
    var wrap = cv.parentElement;
    var w = Math.max(320, Math.floor(wrap.clientWidth - 12));
    var h = 500;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    GEO.w = w; GEO.h = h;
    GEO.rowH = (h - GEO.top - GEO.bottom) / ROWS;
  }

  function colX(i, count){
    if(count < 2) return GEO.w / 2;
    var margin = Math.max(42, Math.min(64, GEO.w * 0.075));
    return margin + i * ((GEO.w - margin * 2) / (count - 1));
  }

  function buildLadder(count){
    var links = [];
    for(var r = 0; r < ROWS; r++){
      var c = 0, added = 0;
      while(c < count - 1){
        if(Math.random() < 0.55){ links.push([r, c]); added++; c += 2; } else { c += 1; }
      }
      if(added === 0 && count > 1){ links.push([r, Math.floor(Math.random() * (count - 1))]); }
    }
    return { rows: ROWS, links: links };
  }

  function trace(startCol, ladder, count){
    var c = startCol, pts = [], i;
    for(i = 0; i < ladder.links.length; i++){}
    pts.push({ x: colX(c, count), y: GEO.top });
    for(var r = 0; r < ladder.rows; r++){
      var midY = GEO.top + (r + 0.5) * GEO.rowH;
      var nextY = GEO.top + (r + 1) * GEO.rowH;
      pts.push({ x: colX(c, count), y: midY });
      var link = null;
      for(var k = 0; k < ladder.links.length; k++){
        var L = ladder.links[k];
        if(L[0] === r && (L[1] === c || L[1] === c - 1)){ link = L; break; }
      }
      if(link){
        c = (link[1] === c) ? c + 1 : c - 1;
        pts.push({ x: colX(c, count), y: midY });
      }
      pts.push({ x: colX(c, count), y: nextY });
    }
    return { end: c, pts: pts };
  }

  // ---- drawing
  function roundRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawVine(x){
    var y1 = GEO.top, y2 = GEO.h - GEO.bottom, seg = 22, amp = 2.4;
    ctx.beginPath();
    ctx.moveTo(x, y1);
    var n = 0;
    for(var y = y1; y < y2; y += seg){
      var yy = Math.min(y + seg, y2);
      var dir = (n % 2 === 0) ? 1 : -1;
      ctx.quadraticCurveTo(x + amp * dir, (y + yy) / 2, x, yy);
      n++;
    }
    ctx.strokeStyle = '#8abf63'; ctx.lineWidth = 5.5; ctx.lineCap = 'round'; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.6; ctx.stroke();

    // leaves
    for(var ly = y1 + 26; ly < y2 - 10; ly += 54){
      var side = (Math.floor((ly - y1) / 54) % 2 === 0) ? 1 : -1;
      ctx.save();
      ctx.translate(x + side * 7, ly);
      ctx.rotate(side * 0.5);
      ctx.beginPath();
      ctx.ellipse(0, 0, 6.5, 3.4, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#a8d488'; ctx.fill();
      ctx.restore();
    }
  }

  function drawRung(x1, x2, y){
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y);
    ctx.strokeStyle = '#dfc98f'; ctx.lineWidth = 12; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y);
    ctx.strokeStyle = '#f4e7bd'; ctx.lineWidth = 6; ctx.stroke();
  }

  function drawAvatar(x, y, r, color, label){
    ctx.beginPath(); ctx.arc(x, y, r + 3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '700 ' + Math.round(r * 0.95) + 'px Jua, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, x, y + 1);
  }

  function drawBadge(cx, cy, text, win){
    var w = win ? 86 : 66, h = win ? 36 : 30;
    if(win){
      roundRect(cx - w / 2, cy - h / 2, w, h, 12);
      var g = ctx.createLinearGradient(0, cy - h / 2, 0, cy + h / 2);
      g.addColorStop(0, '#ffd979'); g.addColorStop(1, '#f0ac33');
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = '700 19px Jua, sans-serif';
    }else{
      roundRect(cx - w / 2, cy - h / 2, w, h, 10);
      ctx.fillStyle = '#e9f4df'; ctx.fill();
      ctx.strokeStyle = '#c3e0a9'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = '#6d9663'; ctx.font = '700 16px Jua, sans-serif';
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, cx, cy + 1);
  }

  var trails = [];   // {id, pts, idx, color}

  function drawScene(){
    var count = state.count, ladder = state.ladder, i;
    if(!ladder) return;
    layout();

    ctx.clearRect(0, 0, GEO.w, GEO.h);
    ctx.fillStyle = '#fdfaf0';
    roundRect(0, 0, GEO.w, GEO.h, 16); ctx.fill();

    // soft ground band
    ctx.fillStyle = '#f1f7e6';
    ctx.beginPath();
    ctx.moveTo(0, GEO.h - GEO.bottom + 8);
    ctx.quadraticCurveTo(GEO.w * 0.5, GEO.h - GEO.bottom - 14, GEO.w, GEO.h - GEO.bottom + 8);
    ctx.lineTo(GEO.w, GEO.h); ctx.lineTo(0, GEO.h); ctx.closePath(); ctx.fill();

    // vines
    for(i = 0; i < count; i++) drawVine(colX(i, count));

    // rungs
    for(i = 0; i < ladder.links.length; i++){
      var L = ladder.links[i];
      drawRung(colX(L[1], count), colX(L[1] + 1, count), GEO.top + (L[0] + 0.5) * GEO.rowH);
    }

    // heads and results
    for(i = 0; i < count; i++){
      var x = colX(i, count);
      var p = state.players[i];
      var color = COLORS[i % COLORS.length];
      if(p){
        var initial = p.name ? p.name.trim().charAt(0) : '?';
        var fs = count >= 7 ? 12 : 14;
        ctx.font = '700 ' + fs + 'px Jua, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = state.reveal[p.id] ? '#7fa86a' : '#7a6653';
        ctx.fillText(p.name.slice(0, count >= 7 ? 4 : 6), x, 22);
        drawAvatar(x, 58, 20, color, initial);
      }else{
        drawAvatar(x, 58, 20, '#ded2bd', '?');
      }
      drawBadge(x, GEO.h - GEO.bottom + 44, i === state.winCol ? '당첨!' : '면제', i === state.winCol);
    }

    // trails
    for(i = 0; i < trails.length; i++){
      var tr = trails[i];
      ctx.beginPath();
      ctx.moveTo(tr.pts[0].x, tr.pts[0].y);
      var last = Math.max(1, Math.min(tr.idx, tr.pts.length - 1));
      for(var k = 1; k <= last; k++) ctx.lineTo(tr.pts[k].x, tr.pts[k].y);
      ctx.strokeStyle = tr.color; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.shadowColor = tr.color; ctx.shadowBlur = 8; ctx.stroke(); ctx.shadowBlur = 0;

      var tip = tr.pts[last];
      ctx.beginPath(); ctx.arc(tip.x, tip.y, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#fff'; ctx.fill();
      ctx.beginPath(); ctx.arc(tip.x, tip.y, 5.5, 0, Math.PI * 2);
      ctx.fillStyle = tr.color; ctx.fill();
    }
  }

  // ---- screens
  function render(){
    var me = state.players.filter(function(p){ return p.id === myId; })[0];
    var inRoom = !!topic;

    show($('#scr-create'), !inRoom);
    show($('#scr-join'), inRoom && !me && state.phase !== 'game');
    show($('#scr-lobby'), inRoom && !!me && state.phase !== 'game');
    show($('#scr-game'), inRoom && state.phase === 'game');

    if(inRoom && !me && state.phase === 'game'){
      $('#joinLead').textContent = '이미 사다리가 시작됐어요';
      $('#joinHint').textContent = '이 방은 게임이 시작되어 새로 들어갈 수 없어요. 방장에게 다시 시작해 달라고 해 주세요.';
      show($('#scr-join'), true);
      $('#btnJoin').disabled = true;
    }else{
      $('#btnJoin').disabled = false;
    }

    if(inRoom && me && state.phase !== 'game') renderLobby(me);
    if(state.phase === 'game'){ renderGame(me); }
  }

  function renderLobby(me){
    var grid = $('#seatGrid');
    grid.innerHTML = '';
    for(var i = 0; i < state.count; i++){
      var p = state.players[i];
      var d = document.createElement('div');
      d.className = 'seat' + (p ? ' filled' : '') + (p && p.id === myId ? ' me' : '');
      if(p){
        d.innerHTML = '<div class="ava" style="background:' + COLORS[i % COLORS.length] + '">' +
          (p.name ? p.name.charAt(0) : '?') + '</div><div class="nm">' + escapeHtml(p.name) + '</div>' +
          (p.id === state.host ? '<div class="tag">방장</div>' : '');
      }else{
        d.innerHTML = '<div class="ava" style="background:#e6dcc8;color:#b6a68d">+</div><div class="ph">대기 중</div>';
      }
      grid.appendChild(d);
    }
    $('#shareLink').value = location.origin + location.pathname + '?r=' + topic;

    var lobbyCount = $('#lobbyCount');
    lobbyCount.value = String(state.count);
    lobbyCount.disabled = (state.host !== myId);

    var filled = state.players.length;
    var isHost = state.host === myId;
    $('#btnStart').style.display = isHost ? '' : 'none';
    $('#btnStart').disabled = filled < 2;
    $('#lobbyHint').textContent = isHost
      ? (filled < 2 ? '두 명 이상 모이면 시작할 수 있어요 (' + filled + '/' + state.count + ')'
                    : filled + '/' + state.count + '명 참가 · 지금 시작해도 돼요')
      : '방장이 시작하면 사다리가 열려요 (' + filled + '/' + state.count + ')';
    $('#btnStart').textContent = filled >= state.count ? '사다리 시작!' : '지금 시작하기';
  }

  var resultShown = false, animating = false;

  function renderGame(me){
    drawScene();
    $('#btnShuffle').style.display = (state.host === myId) ? '' : 'none';
    $('#btnBack').style.display = (state.host === myId) ? '' : 'none';
    $('#btnReveal').disabled = !me;
    if(!resultShown){
      var rc = $('#resultCard');
      if(!animating){ rc.classList.remove('on'); }
    }
    if(!me){
      $('#gameHint').textContent = '이 방의 참가자가 아니에요. 방장이 다시 시작하면 들어갈 수 있어요.';
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  // ---- actions
  $('#btnCreate').addEventListener('click', function(){
    var name = $('#createName').value.trim();
    if(!name){ toast('이름을 입력해 주세요'); return; }
    var count = parseInt($('#createCount').value, 10);
    topic = 'sadari-' + Math.random().toString(36).slice(2, 9);
    sessionStorage.setItem('sadari.topic', topic);
    sessionStorage.setItem('sadari.name', name);
    history.replaceState(null, '', location.pathname + '?r=' + topic);
    connect();
    state.count = count; state.host = myId;
    state.players = [{ id:myId, name:name }];
    pub({ k:'cfg', count:count, host:myId })
      .then(function(){ return pub({ k:'join', id:myId, name:name }); })
      .then(function(){ render(); });
    render();
  });

  $('#btnJoin').addEventListener('click', function(){
    var name = $('#joinName').value.trim();
    if(!name){ toast('이름을 입력해 주세요'); return; }
    sessionStorage.setItem('sadari.name', name);
    pub({ k:'join', id:myId, name:name }).then(function(){ render(); });
  });

  $('#btnCopy').addEventListener('click', function(){
    var link = $('#shareLink').value;
    navigator.clipboard.writeText(link).then(function(){ toast('링크를 복사했어요'); },
      function(){ $('#shareLink').select(); document.execCommand('copy'); toast('링크를 복사했어요'); });
  });

  $('#lobbyCount').addEventListener('change', function(e){
    if(state.host !== myId) return;
    pub({ k:'cfg', count: parseInt(e.target.value, 10), host: myId });
  });

  $('#btnStart').addEventListener('click', function(){
    if(state.host !== myId) return;
    if(state.players.length < 2){ toast('두 명 이상 필요해요'); return; }
    var count = state.count;
    var players = state.players.slice(0, count);
    var ladder = buildLadder(count);
    var winCol = Math.floor(Math.random() * count);
    pub({ k:'start', count:count, players:players, ladder:ladder, winCol:winCol, round:Date.now() });
  });

  $('#btnShuffle').addEventListener('click', function(){
    if(state.host !== myId) return;
    var count = state.count;
    var players = state.players.slice(0, count);
    var ladder = buildLadder(count);
    var winCol = Math.floor(Math.random() * count);
    resultShown = false;
    pub({ k:'start', count:count, players:players, ladder:ladder, winCol:winCol, round:Date.now() });
  });

  function leaveRoom(){
    pub({ k:'leave', id:myId }).catch(function(){});
    sessionStorage.removeItem('sadari.topic');
    setTimeout(function(){ location.href = location.pathname; }, 150);
  }
  $('#btnLeave').addEventListener('click', leaveRoom);
  $('#btnLeave2').addEventListener('click', leaveRoom);

  $('#btnReveal').addEventListener('click', function(){
    var me = state.players.filter(function(p){ return p.id === myId; })[0];
    if(!me || !state.ladder || animating) return;
    var myIdx = state.players.indexOf(me);
    if(myIdx >= state.count) return;
    animating = true; resultShown = false;
    var res = trace(myIdx, state.ladder, state.count);
    var color = COLORS[myIdx % COLORS.length];
    trails = trails.filter(function(t){ return t.id !== myId; });
    var tr = { id: myId, pts: res.pts, idx: 0, color: color };
    trails.push(tr);
    $('#btnReveal').disabled = true;

    var start = null, dur = 1700;
    function step(ts){
      if(!start) start = ts;
      var t = Math.min(1, (ts - start) / dur);
      var e = 1 - Math.pow(1 - t, 3);
      tr.idx = Math.floor(e * (res.pts.length - 1));
      drawScene();
      if(t < 1){ requestAnimationFrame(step); }
      else{
        tr.idx = res.pts.length - 1;
        drawScene();
        animating = false;
        $('#btnReveal').disabled = false;
        $('#btnReveal').textContent = '다시 보기';
        showResult(res.end === state.winCol);
        pub({ k:'reveal', id:myId }).catch(function(){});
      }
    }
    requestAnimationFrame(step);
  });

  function showResult(isWin){
    resultShown = true;
    var rc = $('#resultCard');
    rc.className = 'result-card on ' + (isWin ? 'win' : 'lose');
    rc.innerHTML = isWin
      ? '<div class="big">당첨! 🎉</div><div>오늘의 주인공은 바로 당신이에요</div>'
      : '<div class="big">면제 🌿</div><div>이번엔 편하게 쉬어 가요</div>';
  }

  $('#btnBack').addEventListener('click', function(){
    if(state.host !== myId) return;
    pub({ k:'reset' });
  });

  $('#btnAll').addEventListener('click', function(){
    var rc = $('#resultCard');
    var rows = state.players.slice(0, state.count).map(function(p, i){
      var end = trace(i, state.ladder, state.count).end;
      var win = end === state.winCol;
      return '<div>' + escapeHtml(p.name) + ' → <b>' + (win ? '당첨!' : '면제') + '</b></div>';
    });
    resultShown = true;
    rc.className = 'result-card on';
    rc.innerHTML = '<div class="big">전체 결과</div>' + rows.join('');
  });

  window.addEventListener('resize', function(){ if(state.phase === 'game') drawScene(); });

  // ---- boot
  (function boot(){
    if(topic){
      var saved = sessionStorage.getItem('sadari.name');
      if(saved) $('#joinName').value = saved;
      connect();
      var meKnown = false;
      setTimeout(function(){
        if(!state.players.some(function(p){ return p.id === myId; })) render();
      }, 1200);
    }
    render();
    setConn(false);
  })();
})();
</script>
</body>
</html>
